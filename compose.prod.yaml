services:
  seerr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_TAG: local
    image: seerr:local
    ports:
      - '5055:5055'
    environment:
      TZ: UTC
      # Default in Docker is console-only logs (docker logs). Uncomment for file logs:
      # LOG_TO_FILE: 'true'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Persist settings, DB, logs, and image cache (entrypoint chowns for node user)
      - ./config:/app/config
    restart: unless-stopped
