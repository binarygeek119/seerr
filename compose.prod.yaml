services:
  seerr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_TAG: local
    image: seerr:local
    ports:
      - '5055:5055'
    environment:
      TZ: UTC
    volumes:
      # Persist settings, DB, logs, and image cache (entrypoint chowns for node user)
      - ./config:/app/config
    restart: unless-stopped
