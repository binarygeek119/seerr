name: 📚 Documentation
description: Docs typo or improvement (this repo only)
title: '[Docs]: '
labels: ['documentation', 'awaiting triage']
type: task
body:
  - type: markdown
    attributes:
      value: |
        Documentation in **binarygeek119/seerr** (README, docs in repo). For app bugs, use the bug template.
  - type: input
    id: doc-location
    attributes:
      label: Page or file
      placeholder: README.md or docs/getting-started/docker.mdx
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should change?
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/binarygeek119/seerr/issues).
          required: true
