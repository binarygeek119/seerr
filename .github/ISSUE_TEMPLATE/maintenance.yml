name: 🧰 Maintenance
description: CI, Docker, dependencies, refactors
title: '[Chore]: '
labels: ['maintenance', 'awaiting triage']
type: task
body:
  - type: markdown
    attributes:
      value: |
        Internal tasks for **binarygeek119/seerr** (build, CI, deps). User-facing bugs → bug template.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CI / GitHub Actions
        - Docker / image
        - dependencies
        - refactor
        - other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/binarygeek119/seerr/issues).
          required: true
