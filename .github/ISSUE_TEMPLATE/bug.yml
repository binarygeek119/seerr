name: 🐛 Bug Report
description: Something is broken
labels: ['bug', 'awaiting triage']
type: bug
body:
  - type: markdown
    attributes:
      value: |
        **binarygeek119/seerr** — report bugs here.

        For setup help or general questions, use [Discord](https://discord.gg/xmNs5ecFX) instead of opening an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Seerr version
      description: Settings → About → Version (include commit if shown, e.g. `develop-abc123+`)
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run Seerr (Docker image/tag, OS, browser) and database (SQLite/PostgreSQL).
      placeholder: |
        Docker: binarygeek119/seerr:develop
        OS: Windows 11 / Unraid / etc.
        Browser: Chrome 120
        Database: SQLite
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Relevant lines from Settings → Logs or container logs.
      render: shell
  - type: checkboxes
    id: search-existing
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/binarygeek119/seerr/issues) and did not find a duplicate.
          required: true
        - label: I agree to the [Code of Conduct](https://github.com/binarygeek119/seerr/blob/develop/CODE_OF_CONDUCT.md).
          required: true
