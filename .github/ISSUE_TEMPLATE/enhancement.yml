name: ✨ Feature Request
description: Suggest an improvement
labels: ['enhancement', 'awaiting triage']
type: feature
body:
  - type: markdown
    attributes:
      value: |
        **binarygeek119/seerr** — feature ideas for this fork.

        For questions or support, use [Discord](https://discord.gg/xmNs5ecFX).
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Problem you're solving and the feature you want.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Extra details (optional)
      description: Screenshots, links, or related upstream Seerr issues.
  - type: checkboxes
    id: search-existing
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/binarygeek119/seerr/issues) and did not find this request already.
          required: true
        - label: I agree to the [Code of Conduct](https://github.com/binarygeek119/seerr/blob/develop/CODE_OF_CONDUCT.md).
          required: true
